<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artifact Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #0e0e1a;
    overflow: hidden;
  }
  .card {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 3rem 3.5rem;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 24px 60px rgba(0,0,0,0.45);
  }
  h1 {
    font-size: clamp(2rem, 6vw, 3.5rem);
    background: linear-gradient(90deg, #7afcff, #c084fc, #ff7ac6, #7afcff);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shift 6s linear infinite;
    letter-spacing: -1px;
  }
  @keyframes shift { to { background-position: 300% 0; } }
  p { margin-top: 0.9rem; color: #aeb4d4; font-size: 1.05rem; }
  button {
    margin-top: 1.8rem;
    padding: 0.8rem 1.6rem;
    font-size: 1rem;
    font-weight: 600;
    color: #0e0e1a;
    background: linear-gradient(90deg, #7afcff, #c084fc);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.2s ease;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(192,132,252,0.5); }
  button:active { transform: translateY(0); }
  #count { font-variant-numeric: tabular-nums; }
  canvas { position: fixed; inset: 0; z-index: 1; }
</style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="card">
    <h1>Artifacts work ✨</h1>
    <p>If you can see this, the feature is doing its job.</p>
    <p>Clicks so far: <span id="count">0</span></p>
    <button id="btn">Give it a click</button>
  </div>

<script>
  // Click counter
  let n = 0;
  const out = document.getElementById('count');
  document.getElementById('btn').addEventListener('click', () => {
    out.textContent = ++n;
    burst();
  });

  // Floating particle background
  const c = document.getElementById('bg');
  const ctx = c.getContext('2d');
  let w, h, dots = [];
  function resize() {
    w = c.width = innerWidth;
    h = c.height = innerHeight;
    dots = Array.from({length: 70}, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 2 + 0.5,
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.4
    }));
  }
  resize();
  addEventListener('resize', resize);

  function loop() {
    ctx.clearRect(0, 0, w, h);
    for (const d of dots) {
      d.x += d.vx; d.y += d.vy;
      if (d.x < 0 || d.x > w) d.vx *= -1;
      if (d.y < 0 || d.y > h) d.vy *= -1;
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(160,170,255,0.5)';
      ctx.fill();
    }
    requestAnimationFrame(loop);
  }
  loop();

  // Confetti burst on click
  let confetti = [];
  function burst() {
    const colors = ['#7afcff', '#c084fc', '#ff7ac6', '#fff07a'];
    for (let i = 0; i < 30; i++) {
      confetti.push({
        x: w/2, y: h/2,
        vx: (Math.random()-0.5)*12,
        vy: (Math.random()-0.5)*12 - 2,
        life: 60,
        color: colors[i % colors.length]
      });
    }
  }
  (function fx(){
    for (let i = confetti.length-1; i >= 0; i--) {
      const p = confetti[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.life--;
      ctx.globalAlpha = Math.max(p.life/60, 0);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, 5, 5);
      ctx.globalAlpha = 1;
      if (p.life <= 0) confetti.splice(i, 1);
    }
    requestAnimationFrame(fx);
  })();
</script>
</body>
</html>
